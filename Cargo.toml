[package]
name = "mindcrab"
version = "0.3.1"
description = "Self-hosted Obsidian-style Markdown notebook with an MCP server for AI memory"
license = "MIT"
repository = "https://github.com/mustafabayramguven/MindCrab"
edition = "2024"

[dependencies]
ammonia = "4.2.5"
anyhow = "1.0.104"
axum = "0.8"
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
getrandom = "0.4"
hex = "0.4.3"
mime_guess = "2.0.5"
notify = "9.0.0"
pulldown-cmark = "0.13.6"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = { version = "8.14.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br", "set-header", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3.5.2", features = ["json"] }
walkdir = "2.5.1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
