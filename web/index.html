<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>MindCrab</title>
  <meta name="theme-color" content="#6b4fa0">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/roboto-flex-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <link rel="modulepreload" href="/icons.js">
  <link rel="modulepreload" href="/i18n.js">
  <link rel="modulepreload" href="/views.js">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <!-- Login -->
  <section id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <img src="/icon.svg" alt="" width="72" height="72">
      <h1 class="display-small">MindCrab</h1>
      <p class="body-medium muted" data-i18n="login.subtitle"></p>
      <label class="text-field">
        <input id="login-token" type="password" autocomplete="current-password" required placeholder=" ">
        <span data-i18n="login.token"></span>
      </label>
      <p id="login-error" class="error-text body-small" hidden></p>
      <button class="btn filled" type="submit" data-i18n="login.submit"></button>
      <p class="body-small muted" data-i18n="login.hint"></p>
    </form>
  </section>

  <!-- App -->
  <div id="app" class="app" hidden>
    <div class="scrim" id="scrim"></div>

    <nav class="drawer" id="drawer">
      <div class="drawer-head">
        <img src="/icon.svg" alt="" width="32" height="32">
        <span class="title-large">MindCrab</span>
      </div>
      <button class="search-bar" id="open-search" type="button">
        <i data-icon="search"></i><span data-i18n="search.placeholder"></span><kbd>Ctrl K</kbd>
      </button>
      <div class="drawer-actions">
        <button class="btn fab-extended" id="new-note" type="button"><i data-icon="edit_note"></i><span data-i18n="action.newNote"></span></button>
        <button class="icon-btn tonal" id="new-folder" type="button" data-i18n-title="action.newFolder"><i data-icon="create_new_folder"></i></button>
        <button class="icon-btn tonal" id="open-daily" type="button" data-i18n-title="action.daily"><i data-icon="today"></i></button>
        <button class="icon-btn tonal" id="new-canvas" type="button" data-i18n-title="action.newCanvas"><i data-icon="dashboard"></i></button>
      </div>
      <div class="drawer-scroll">
        <div class="nav-list">
          <a class="nav-item" href="#/tasks" data-nav="tasks"><i data-icon="checklist"></i><span data-i18n="nav.tasks"></span><span class="nav-badge" id="tasks-badge" hidden></span></a>
          <a class="nav-item" href="#/calendar" data-nav="calendar"><i data-icon="calendar_month"></i><span data-i18n="nav.calendar"></span></a>
          <a class="nav-item" href="#/activity" data-nav="activity"><i data-icon="smart_toy"></i><span data-i18n="nav.activity"></span></a>
          <a class="nav-item" href="#/review" data-nav="review"><i data-icon="fact_check"></i><span data-i18n="nav.review"></span><span class="nav-badge" id="pending-badge" hidden></span></a>
        </div>
        <div class="section-label label-large" data-i18n="nav.files"></div>
        <ul class="tree" id="tree" role="tree"></ul>
        <details class="tags-block" id="tags-block">
          <summary class="section-label label-large"><span data-i18n="nav.tags"></span><i data-icon="keyboard_arrow_down"></i></summary>
          <div class="chips" id="tag-list"></div>
        </details>
      </div>
      <div class="drawer-foot">
        <button class="nav-item" id="nav-graph" type="button"><i data-icon="hub"></i><span data-i18n="nav.graph"></span></button>
        <button class="nav-item" id="nav-settings" type="button"><i data-icon="settings"></i><span data-i18n="nav.settings"></span></button>
      </div>
    </nav>

    <main class="main">
      <header class="top-bar">
        <button class="icon-btn" id="toggle-drawer" type="button" data-i18n-title="action.menu"><i data-icon="menu"></i></button>
        <div class="top-title">
          <div class="crumbs label-medium" id="crumbs"></div>
          <div class="title-large note-title" id="note-title"></div>
        </div>
        <span class="save-state label-medium" id="save-state"></span>
        <div class="segmented" id="mode-switch" role="group">
          <button type="button" data-mode="edit" data-i18n-title="mode.edit"><i data-icon="edit"></i></button>
          <button type="button" data-mode="split" data-i18n-title="mode.split" class="hide-mobile"><i data-icon="vertical_split"></i></button>
          <button type="button" data-mode="preview" data-i18n-title="mode.preview"><i data-icon="visibility"></i></button>
        </div>
        <button class="icon-btn" id="toggle-panel" type="button" data-i18n-title="action.panel"><i data-icon="right_panel_open"></i></button>
        <button class="icon-btn" id="note-menu" type="button" data-i18n-title="action.more"><i data-icon="more_vert"></i></button>
      </header>

      <div class="offline-banner" id="offline-banner" hidden><i data-icon="cloud_off"></i><span data-i18n="offline.banner"></span></div>
      <div class="content" id="content">
        <!-- Note view -->
        <section class="note-view" id="note-view" hidden>
          <div class="toolbar" id="toolbar">
            <button type="button" data-fmt="bold" data-i18n-title="fmt.bold"><i data-icon="format_bold"></i></button>
            <button type="button" data-fmt="italic" data-i18n-title="fmt.italic"><i data-icon="format_italic"></i></button>
            <button type="button" data-fmt="heading" data-i18n-title="fmt.heading"><i data-icon="title"></i></button>
            <button type="button" data-fmt="list" data-i18n-title="fmt.list"><i data-icon="format_list_bulleted"></i></button>
            <button type="button" data-fmt="task" data-i18n-title="fmt.task"><i data-icon="checklist"></i></button>
            <button type="button" data-fmt="quote" data-i18n-title="fmt.quote"><i data-icon="format_quote"></i></button>
            <button type="button" data-fmt="code" data-i18n-title="fmt.code"><i data-icon="code"></i></button>
            <button type="button" data-fmt="wikilink" data-i18n-title="fmt.wikilink"><i data-icon="add_link"></i></button>
            <button type="button" data-fmt="tag" data-i18n-title="fmt.tag"><i data-icon="tag"></i></button>
            <button type="button" data-fmt="base" data-i18n-title="fmt.base"><i data-icon="table"></i></button>
            <button type="button" data-fmt="template" data-i18n-title="fmt.template"><i data-icon="note_stack"></i></button>
            <button type="button" data-fmt="attach" data-i18n-title="fmt.attach"><i data-icon="attach_file"></i></button>
            <input type="file" id="file-input" hidden multiple>
          </div>
          <details class="props-editor" id="props-editor">
            <summary class="label-large"><i data-icon="sell"></i><span data-i18n="props.title"></span><span class="props-count" id="props-count"></span></summary>
            <div class="props-rows" id="props-rows"></div>
          </details>
          <div class="panes" id="panes">
            <div class="editor-wrap">
              <textarea id="editor" class="editor" spellcheck="false" autocapitalize="sentences"></textarea>
            </div>
            <article class="preview markdown" id="preview"></article>
          </div>
        </section>

        <!-- List view (tags, search results) -->
        <section class="list-view" id="list-view" hidden>
          <h2 class="headline-small" id="list-title"></h2>
          <div class="cards" id="list-items"></div>
        </section>

        <!-- Graph -->
        <section class="graph-view" id="graph-view" hidden>
          <canvas id="graph-canvas"></canvas>
          <div class="graph-controls">
            <label class="switch-row label-large"><input type="checkbox" id="graph-local"><span class="switch"></span><span data-i18n="graph.local"></span></label>
            <label class="switch-row label-large"><input type="checkbox" id="graph-orphans" checked><span class="switch"></span><span data-i18n="graph.orphans"></span></label>
          </div>
        </section>

        <!-- Pages: tasks, calendar, activity, review -->
        <section class="page-view" id="page-view" hidden></section>

        <!-- Canvas -->
        <section class="canvas-view" id="canvas-view" hidden></section>

        <!-- Empty -->
        <section class="empty-view" id="empty-view" hidden>
          <i data-icon="psychology" class="huge"></i>
          <p class="title-medium" data-i18n="empty.title"></p>
          <p class="body-medium muted" data-i18n="empty.body"></p>
        </section>
      </div>
    </main>

    <aside class="side-panel" id="side-panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="links" class="active"><i data-icon="link"></i><span data-i18n="panel.links"></span></button>
        <button type="button" role="tab" data-tab="history"><i data-icon="history"></i><span data-i18n="panel.history"></span></button>
        <button type="button" role="tab" data-tab="info"><i data-icon="info"></i><span data-i18n="panel.info"></span></button>
        <button class="icon-btn close-panel" id="close-panel" type="button"><i data-icon="close"></i></button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </aside>

    <button class="fab" id="fab" type="button" data-i18n-title="action.newNote"><i data-icon="edit_note"></i></button>
  </div>

  <!-- Wikilink autocomplete -->
  <div class="menu suggest" id="suggest" hidden></div>
  <!-- Generic menu -->
  <div class="menu" id="menu" hidden></div>
  <!-- Link hover preview -->
  <div class="hover-card" id="hover-card" hidden></div>
  <!-- Snackbar -->
  <div class="snackbar" id="snackbar" hidden></div>

  <!-- Search dialog -->
  <dialog class="dialog search-dialog" id="search-dialog">
    <div class="search-head">
      <i data-icon="search"></i>
      <input id="search-input" type="search" autocomplete="off" data-i18n-placeholder="search.placeholder">
      <button class="icon-btn" type="button" data-close><i data-icon="close"></i></button>
    </div>
    <div class="search-hint body-small muted" data-i18n="search.hint"></div>
    <ul class="search-results" id="search-results"></ul>
  </dialog>

  <!-- Prompt / confirm dialog -->
  <dialog class="dialog basic" id="prompt-dialog">
    <form method="dialog" id="prompt-form">
      <h2 class="headline-small" id="prompt-title"></h2>
      <p class="body-medium muted" id="prompt-text"></p>
      <label class="text-field" id="prompt-field">
        <input id="prompt-input" autocomplete="off" placeholder=" ">
        <span id="prompt-label"></span>
      </label>
      <label class="select-field" id="prompt-select-wrap" hidden>
        <span class="label-medium muted" id="prompt-select-label"></span>
        <select id="prompt-select"></select>
      </label>
      <div class="dialog-actions">
        <button class="btn text" value="cancel" type="submit" formnovalidate data-i18n="action.cancel"></button>
        <button class="btn filled" value="ok" type="submit" id="prompt-ok"></button>
      </div>
    </form>
  </dialog>

  <!-- Revision viewer -->
  <dialog class="dialog large" id="revision-dialog">
    <div class="dialog-head">
      <h2 class="headline-small" id="revision-title"></h2>
      <button class="icon-btn" type="button" data-close><i data-icon="close"></i></button>
    </div>
    <pre class="revision-diff" id="revision-body"></pre>
    <div class="dialog-actions">
      <button class="btn text" type="button" data-close data-i18n="action.close"></button>
      <button class="btn filled" type="button" id="revision-restore"><i data-icon="settings_backup_restore"></i><span data-i18n="history.restore"></span></button>
    </div>
  </dialog>

  <!-- Connection editor -->
  <dialog class="dialog basic" id="conn-dialog">
    <form method="dialog" id="conn-form">
      <h2 class="headline-small" id="conn-title"></h2>
      <label class="text-field"><input id="conn-name" required placeholder=" " autocomplete="off"><span data-i18n="conn.name"></span></label>
      <label class="text-field"><input id="conn-folders" placeholder=" " autocomplete="off"><span data-i18n="conn.folders"></span></label>
      <p class="body-small muted" data-i18n="conn.foldersHint"></p>
      <label class="switch-row label-large"><input type="checkbox" id="conn-readonly"><span class="switch"></span><span data-i18n="conn.readOnly"></span></label>
      <label class="switch-row label-large"><input type="checkbox" id="conn-review"><span class="switch"></span><span data-i18n="conn.review"></span></label>
      <div class="conn-token" id="conn-token" hidden></div>
      <div class="dialog-actions">
        <button class="btn text" value="cancel" type="submit" formnovalidate data-i18n="action.close"></button>
        <button class="btn filled" value="ok" type="submit" id="conn-ok" data-i18n="action.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Share target -->
  <dialog class="dialog basic" id="share-dialog">
    <form method="dialog">
      <h2 class="headline-small" data-i18n="share.title"></h2>
      <label class="text-field"><input id="share-name" placeholder=" " autocomplete="off"><span data-i18n="share.name"></span></label>
      <textarea id="share-text" class="code-area" rows="5"></textarea>
      <div class="share-files body-small muted" id="share-files"></div>
      <label class="select-field"><span class="label-medium muted" data-i18n="share.target"></span>
        <select id="share-target">
          <option value="daily" data-i18n="share.daily"></option>
          <option value="inbox" data-i18n="share.inbox"></option>
          <option value="new" data-i18n="share.new"></option>
        </select>
      </label>
      <div class="dialog-actions">
        <button class="btn text" value="cancel" type="submit" formnovalidate data-i18n="action.cancel"></button>
        <button class="btn filled" value="ok" type="submit" data-i18n="action.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog class="dialog large" id="settings-dialog">
    <div class="dialog-head">
      <h2 class="headline-small" data-i18n="nav.settings"></h2>
      <button class="icon-btn" type="button" data-close><i data-icon="close"></i></button>
    </div>
    <div class="settings-body">
      <h3 class="title-medium"><i data-icon="palette"></i><span data-i18n="settings.appearance"></span></h3>
      <div class="segmented wide" id="theme-switch" role="group">
        <button type="button" data-theme="system"><i data-icon="contrast"></i><span data-i18n="settings.system"></span></button>
        <button type="button" data-theme="light"><i data-icon="light_mode"></i><span data-i18n="settings.light"></span></button>
        <button type="button" data-theme="dark"><i data-icon="dark_mode"></i><span data-i18n="settings.dark"></span></button>
      </div>
      <p class="label-large" data-i18n="settings.color"></p>
      <div class="swatches" id="swatches"></div>
      <label class="switch-row label-large"><input type="checkbox" id="opt-wide"><span class="switch"></span><span data-i18n="settings.wide"></span></label>
      <label class="switch-row label-large"><input type="checkbox" id="opt-spell"><span class="switch"></span><span data-i18n="settings.spell"></span></label>

      <h3 class="title-medium"><i data-icon="shield"></i><span data-i18n="settings.privacy"></span></h3>
      <p class="body-medium muted" data-i18n="settings.privacyIntro"></p>
      <textarea id="ai-ignore" class="code-area" rows="5" spellcheck="false" placeholder="Özel/&#10;Sağlık/**&#10;*.secret.md"></textarea>
      <div class="row-actions"><button class="btn tonal" id="ai-ignore-save" type="button"><i data-icon="check"></i><span data-i18n="action.save"></span></button><span class="body-small muted" id="ai-hidden-count"></span></div>

      <h3 class="title-medium"><i data-icon="key"></i><span data-i18n="settings.connections"></span></h3>
      <p class="body-medium muted" data-i18n="settings.connectionsIntro"></p>
      <div id="conn-list" class="conn-list"></div>
      <div class="row-actions"><button class="btn tonal" id="conn-add" type="button"><i data-icon="add"></i><span data-i18n="settings.connAdd"></span></button></div>

      <h3 class="title-medium"><i data-icon="smart_toy"></i><span data-i18n="settings.mcp"></span></h3>
      <p class="body-medium muted" data-i18n="settings.mcpIntro"></p>
      <div id="mcp-info"></div>

      <h3 class="title-medium"><i data-icon="neurology"></i><span data-i18n="settings.semantic"></span></h3>
      <div id="semantic-info" class="body-medium"></div>

      <h3 class="title-medium"><i data-icon="offline_pin"></i><span data-i18n="settings.offline"></span></h3>
      <p class="body-medium muted" data-i18n="settings.offlineIntro"></p>
      <div class="row-actions">
        <button class="btn tonal" id="offline-download" type="button"><i data-icon="download"></i><span data-i18n="settings.offlineDownload"></span></button>
        <button class="btn text" id="offline-clear" type="button"><i data-icon="delete_sweep"></i><span data-i18n="settings.offlineClear"></span></button>
      </div>
      <p class="body-small muted" id="offline-status"></p>

      <h3 class="title-medium"><i data-icon="key"></i><span data-i18n="settings.session"></span></h3>
      <button class="btn outlined" id="logout" type="button"><i data-icon="logout"></i><span data-i18n="settings.logout"></span></button>
      <p class="body-small muted" id="version"></p>
    </div>
  </dialog>
</body>
</html>
