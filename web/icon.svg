<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="32" fill="#6b4fa0"/>
  <g fill="#f3e9ff">
    <!-- claws -->
    <path d="M22 44a14 14 0 1 1 22 4l-6-4-2 8a14 14 0 0 1-14-8z"/>
    <path d="M106 44a14 14 0 1 0-22 4l6-4 2 8a14 14 0 0 0 14-8z"/>
    <!-- arms -->
    <rect x="32" y="50" width="8" height="22" rx="4" transform="rotate(-25 36 61)"/>
    <rect x="88" y="50" width="8" height="22" rx="4" transform="rotate(25 92 61)"/>
    <!-- legs -->
    <rect x="22" y="80" width="22" height="7" rx="3.5" transform="rotate(20 33 83)"/>
    <rect x="84" y="80" width="22" height="7" rx="3.5" transform="rotate(-20 95 83)"/>
    <rect x="26" y="92" width="20" height="7" rx="3.5" transform="rotate(35 36 95)"/>
    <rect x="82" y="92" width="20" height="7" rx="3.5" transform="rotate(-35 92 95)"/>
    <!-- body -->
    <ellipse cx="64" cy="82" rx="30" ry="22"/>
