  <!-- note graph on the shell -->
  <g stroke="#6b4fa0" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M50 84 62 74 78 82 66 92z"/>
  </g>
  <g fill="#6b4fa0">
    <circle cx="50" cy="84" r="5"/>
    <circle cx="62" cy="74" r="5"/>
    <circle cx="78" cy="82" r="5"/>
    <circle cx="66" cy="92" r="5"/>
  </g>
  <!-- eyes -->
  <g fill="#f3e9ff"><rect x="53" y="50" width="5" height="12" rx="2.5"/><rect x="70" y="50" width="5" height="12" rx="2.5"/></g>
  <g fill="#f3e9ff" stroke="#6b4fa0" stroke-width="2"><circle cx="55.5" cy="48" r="6"/><circle cx="72.5" cy="48" r="6"/></g>
  <g fill="#2a1747"><circle cx="56.5" cy="48.5" r="2.6"/><circle cx="73.5" cy="48.5" r="2.6"/></g>
